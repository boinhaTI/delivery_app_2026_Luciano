apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-ms
  namespace: delivery
  labels:
    app: customer-ms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer-ms
  template:
    metadata:
      labels:
        app: customer-ms
    spec:
      enableServiceLinks: false
      containers:
        - name: customer-ms
          image: seu_usuario_dockerhub/customer-ms:__TAG__
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - { name: DB_HOST, value: postgres }
            - { name: DB_PORT, value: "5432" }
            - { name: DB_NAME, value: customer_db }
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: postgres-credentials, key: POSTGRES_USER }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: postgres-credentials, key: POSTGRES_PASSWORD }
            - { name: REDIS_HOST, value: redis }
            - { name: KAFKA_HOST, value: kafka }
            - { name: KAFKA_PORT, value: "9092" }
            - { name: SELLER_SERVICE_HOST, value: seller-ms }
            - { name: SELLER_SERVICE_PORT, value: "8082" }
          startupProbe:                      # Spring + Flyway: até 3 min para subir
            httpGet: { path: /customer-app/actuator/health, port: 8081 }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /customer-app/actuator/health, port: 8081 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /customer-app/actuator/health, port: 8081 }
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 768Mi }