server:
  port: 8082
  servlet:
    context-path: /seller-app


spring:
  application:
    name: seller-ms
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:seller_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:20071950}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migration: true
    fail-on-missing-locations: true
  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost}:${KAFKA_PORT:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        spring.json.type.mapping: >-
          orderResponse: com.edu.catolica.seller_ms.dto.OrderResponseDTO,
          orderStatusUpdated: com.edu.catolica.seller_ms.dto.OrderStatusUpdateDTO
    consumer:
      group-id: seller-ms
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.edu.catolica.seller_ms.dto.OrderCreatedEventDTO
        spring.json.trusted.packages: br.edu.api.seller
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
    properties:
      spring.json.add.type.headers: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}